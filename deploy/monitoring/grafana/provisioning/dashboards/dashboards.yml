# Dashboard provider: JSON files mounted at /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: dora
    orgId: 1
    folder: Dora B2B
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
