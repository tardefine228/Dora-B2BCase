# Alembic configuration for the PostgreSQL schema (JOB_STORE=postgres).
#
# The application runs `upgrade head` itself at startup (app/migrations_runner.py),
# so there is nothing to type on the target machine. This file exists for the
# offline review path and for manual work:
#
#   DATABASE_URL=postgresql://... PYTHONPATH=api alembic -c api/alembic.ini upgrade head
#   DATABASE_URL=postgresql://... PYTHONPATH=api alembic -c api/alembic.ini upgrade head --sql
#
# The SQL is written to be idempotent (`CREATE TABLE IF NOT EXISTS`, `ADD COLUMN
# IF NOT EXISTS`): a database created by a release that predates migrations
# upgrades in place instead of needing a manual `alembic stamp`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Filled from DATABASE_URL by app/migrations_runner.py (and by scripts/alembic).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
