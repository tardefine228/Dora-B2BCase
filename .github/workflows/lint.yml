name: Lint, API tests and model quality gate

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -r api/requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run API tests
        env:
          PYTHONPATH: api
        run: python -m pytest api/tests -q

  # Model quality gate: rebuild the reranker from the catalog deterministically
  # and fail the build when the labeled-set metrics regress below the floor
  # recorded in eval/experiments.md. The artifact is cached by the hash of
  # everything that influences training; a cache hit skips the ~5 min rebuild.
  quality:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements-dev.txt numpy

      - name: Restore model artifacts
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: reranker-${{ hashFiles('ml/**/*.py', 'scripts/build_model.py', 'data/data.csv', 'data/data.json') }}

      - name: Build model artifacts
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/build_model.py

      - name: Model tests (trained artifact)
        env:
          PYTHONPATH: api
        run: python -m pytest api/tests/test_reranker.py api/tests/test_lexicon.py -q

      - name: Quality gate on the labeled set
        env:
          PYTHONPATH: api
        # Floors = current result minus 1-2 labeled rows (see eval/experiments.md,
        # experiment 11: the set grew to 214 rows, so the floors were re-taken).
        run: |
          python eval/run_eval.py --sweep --output eval_report_ci.md \
            --min-top1 ${MIN_TOP1:-83} \
            --min-top3 ${MIN_TOP3:-88} \
            --min-silence ${MIN_SILENCE:-91} \
            --min-exact ${MIN_EXACT:-98}

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report_ci.md
            models/reranker.json
          if-no-files-found: ignore

  # Demo UI must build: the Docker image ships only frontend/dist (see api/Dockerfile).
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build the UI
        working-directory: frontend
        run: npm run build
