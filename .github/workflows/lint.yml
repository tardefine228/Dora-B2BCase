name: Lint, API tests and model quality gate

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dora_test
          POSTGRES_PASSWORD: dora_test
          POSTGRES_DB: dora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dora_test -d dora_test"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -r api/requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run API tests
        env:
          PYTHONPATH: api
          TEST_DATABASE_URL: postgresql://dora_test:dora_test@localhost:5432/dora_test
        # eval/golden_1875/test_dataset.py pins the synthetic fixtures to the
        # shipped catalog hashes; it rotted once already because nothing ran it.
        run: python -m pytest api/tests eval/golden_1875/test_dataset.py -q

  # Model quality gate: rebuild the reranker from the catalog deterministically, prove
  # that the shipped artifact still equals a fresh build, and compare the labeled-set
  # metrics row by row with a recorded measurement (eval/baselines/*.json). Floors on a
  # rate are deliberately gone: they were calibrated on an artifact that could not be
  # rebuilt and quietly stopped describing anything. The artifact is cached by the hash
  # of everything that influences training; a cache hit skips the ~5 min rebuild.
  quality:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements-dev.txt numpy

      - name: Restore model artifacts
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: reranker-lemma-${{ hashFiles('ml/**/*.py', 'scripts/build_model.py', 'data/data.csv', 'data/data.json') }}

      - name: Build model artifacts
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python scripts/build_model.py

      - name: Shipped artifacts match a rebuild
        # The shipped lexical reranker used to be a file the current trainer could not
        # reproduce (29277 pairs vs 27858), so its numbers could never be re-verified.
        # The check is semantic on purpose: weights come out of a BLAS optimiser, so the
        # last digits depend on the machine, but the run description (pairs, split,
        # thresholds, features) and the weights to 1e-6 must match.
        # For the vector artifact only the metrics are stable, so it is guarded by
        # ml/artifacts/dense-gate.json + api/tests/test_shipped_artifacts.py instead.
        run: python scripts/check_artifacts.py models/reranker.json ml/artifacts/reranker.json

      - name: Model tests (trained artifact)
        env:
          PYTHONPATH: api
        run: python -m pytest api/tests/test_reranker.py api/tests/test_lexicon.py -q

      # The rollback path: no vectors, so the lexical artifact scores.
      - name: Quality gate — lexical artifact
        env:
          PYTHONPATH: api
          EMBEDDER_BACKEND: tfidf
          VECTOR_SEARCH: "false"
        run: |
          python eval/run_eval.py --output eval_report_ci.md \
            --report eval_report_ci.json \
            --baseline eval/baselines/lexical.json

      # The shipping path: tfidf embedder + the reranker trained for it. Measured on the
      # artifacts that are actually in the image (models/ holds only the rebuilt lexical
      # file, so the dense one resolves to ml/artifacts/reranker.tfidf.json).
      - name: Quality gate — shipping path with vector features
        env:
          PYTHONPATH: api
          EMBEDDER_BACKEND: tfidf
          VECTOR_SEARCH: "true"
        run: |
          python eval/run_eval.py --output eval_report_ci_dense.md \
            --report eval_report_ci_dense.json \
            --baseline eval/baselines/dense-tfidf.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            eval_report_ci.md
            eval_report_ci.json
            eval_report_ci_dense.md
            eval_report_ci_dense.json
            models/reranker.json
          if-no-files-found: ignore

  # Demo UI must build: the Docker image ships only frontend/dist (see api/Dockerfile).
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend regression tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build the UI
        working-directory: frontend
        run: npm run build

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: frontend/test-results/

  # OPS-5: the documented backup/restore flow is exercised on every PR against
  # a real PostgreSQL 16 (the same major version as docker-compose): migrations
  # create the schema, a row is written, pg_dump output is reloaded into a
  # scratch database, and revision + row counts must match. scripts/pg_backup.sh
  # and pg_restore_check.sh run the same commands on the target machine.
  postgres-restore:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dora
          POSTGRES_PASSWORD: dora
          POSTGRES_DB: dora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dora -d dora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements-dev.txt

      # Use the client binaries *inside* the service container: the runner's apt
      # repository tracks a newer PostgreSQL major than the pinned 16-alpine
      # service, and a dump taken with mismatched majors fails when restored
      # (psql exit 3). This mirrors the operator scripts (docker compose exec).
      - name: Locate the postgres service container
        id: db
        run: |
          CID=$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -1)
          if [ -z "$CID" ]; then
            CID=$(docker ps --filter "name=postgres" --format '{{.ID}}' | head -1)
          fi
          test -n "$CID"
          echo "cid=$CID" >> "$GITHUB_OUTPUT"
          docker exec "$CID" pg_isready -U dora -d dora

      - name: Apply migrations to a clean database
        env:
          PYTHONPATH: api
          DATABASE_URL: postgresql://dora:dora@localhost:5432/dora
        run: |
          python -c "from app.migrations_runner import upgrade_to_head, current_revision; \
          url='postgresql://dora:dora@localhost:5432/dora'; \
          upgrade_to_head(url); \
          print('revision:', current_revision(url))"

      - name: Seed an audit row
        run: |
          docker exec "${{ steps.db.outputs.cid }}" psql -U dora -d dora -v ON_ERROR_STOP=1 -c \
            "INSERT INTO classification_log (source, query, status) VALUES ('ci', 'проверка бэкапа', 'ok')"

      - name: Dump and restore into a scratch database
        run: |
          set -euo pipefail
          CID="${{ steps.db.outputs.cid }}"
          bash -n scripts/pg_backup.sh scripts/pg_restore_check.sh
          docker exec "$CID" pg_dump -U dora -d dora --no-owner --clean --if-exists \
            | gzip > /tmp/dora.sql.gz
          docker exec "$CID" psql -U dora -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS dora_restore_check" \
            -c "CREATE DATABASE dora_restore_check"
          gunzip -c /tmp/dora.sql.gz | \
            docker exec -i "$CID" psql -U dora -d dora_restore_check -v ON_ERROR_STOP=1 -q

      - name: Verify revision and row counts match the source
        run: |
          set -euo pipefail
          CID="${{ steps.db.outputs.cid }}"
          src_rev=$(docker exec "$CID" psql -U dora -d dora -t -Ac 'SELECT version_num FROM alembic_version')
          dst_rev=$(docker exec "$CID" psql -U dora -d dora_restore_check -t -Ac 'SELECT version_num FROM alembic_version')
          test "$src_rev" = "$dst_rev"
          test -n "$dst_rev"
          for table in jobs classification_log classification_feedback; do
            src=$(docker exec "$CID" psql -U dora -d dora -t -Ac "SELECT count(*) FROM $table")
            dst=$(docker exec "$CID" psql -U dora -d dora_restore_check -t -Ac "SELECT count(*) FROM $table")
            test "$src" = "$dst"
            echo "$table: $dst строк"
          done
          test "$(docker exec "$CID" psql -U dora -d dora_restore_check -t -Ac \
            "SELECT count(*) FROM classification_log WHERE query='проверка бэкапа'")" = "1"
          docker exec "$CID" psql -U dora -d postgres -c "DROP DATABASE dora_restore_check"

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Explicit lightweight mode checks packaging and service wiring, not E5 quality.
    env:
      INSTALL_TRANSFORMER: "false"
      EMBEDDER_BACKEND: tfidf
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise Compose services
        run: bash scripts/docker_smoke.sh --build
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop test containers
        if: always()
        run: docker compose down
