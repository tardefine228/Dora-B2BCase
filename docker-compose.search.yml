# Use together with docker-compose.yml, from the same project directory.
# Keeps the existing database, queue, source links and named volumes.
x-search-env: &search-env
  CLASSIFIER_BACKEND: catalog
  VECTOR_SEARCH: "true"
  VECTOR_STORE: qdrant
  EMBEDDER_BACKEND: sentence-transformers
  MODEL_NAME: /opt/models/embedder
  MODEL_LOCAL_ONLY: "true"
  MODEL_DEVICE: cpu
  MODEL_BATCH_SIZE: "16"

services:
  api:
    build:
      args:
        INSTALL_TRANSFORMER: "true"
        EMBEDDER_MODEL: intfloat/multilingual-e5-small
    environment: *search-env
  worker:
    environment: *search-env
