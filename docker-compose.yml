# Dora B2B: one command — `docker compose up --build` — starts the whole stack:
#   api       FastAPI + React UI (/ui)           :8000
#   worker    Celery worker for heavy batches    (same image as api)
#   postgres  jobs, batch results, audit log
#   redis     Celery broker
#   qdrant    vector store for catalog embeddings
x-app-env: &app-env
  APP_NAME: "Dora B2BCase API"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  CLASSIFIER_BACKEND: "${CLASSIFIER_BACKEND:-catalog}"
  # Empty = keep the model artifact floors; values are read at API/worker startup.
  CATALOG_OK_FLOOR: "${CATALOG_OK_FLOOR:-}"
  CATALOG_REVIEW_FLOOR: "${CATALOG_REVIEW_FLOOR:-}"
  # Only for the pure-semantic `qdrant` backend (experiments); the default needs neither.
  ML_ENABLED: "${ML_ENABLED:-false}"
  # auto: reranker.<embedder-tag>.json when present, else the lexical one;
  # lexical: always reranker.json (rollback switch, no rebuild needed).
  SEMANTIC_RERANKER: "${SEMANTIC_RERANKER:-auto}"
  CATALOG_PATH: "${CATALOG_PATH:-}"
  DATA_DIR: "/app/data"
  # Vector search: embeddings of the catalog live in Qdrant; the embedder is the baked-in
  # transformer (falls back to spaCy vectors) — see /health/ready -> vector_search.
  VECTOR_SEARCH: "${VECTOR_SEARCH:-true}"
  VECTOR_STORE: "${VECTOR_STORE:-qdrant}"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
  QDRANT_COLLECTION: "${QDRANT_COLLECTION:-pp1875_items}"
  EMBEDDER_BACKEND: "${EMBEDDER_BACKEND:-auto}"
  MODEL_NAME: "${MODEL_NAME:-/opt/models/embedder}"
  MODEL_LOCAL_ONLY: "${MODEL_LOCAL_ONLY:-true}"
  MODEL_DEVICE: "${MODEL_DEVICE:-cpu}"
  MODEL_BATCH_SIZE: "${MODEL_BATCH_SIZE:-16}"
  # Cap the tokenizer window: long-context embedders (bge-m3: 8192) otherwise reserve
  # buffers for a length no product name ever needs. 0 = keep the model default.
  MODEL_MAX_SEQ_LENGTH: "${MODEL_MAX_SEQ_LENGTH:-512}"
  # Jobs and audit log in PostgreSQL; batches run in the Celery worker through Redis.
  JOB_STORE: "postgres"
  DATABASE_URL: "postgresql://dora:${POSTGRES_PASSWORD:-dora}@postgres:5432/dora"
  QUEUE_BACKEND: "celery"
  REDIS_URL: "redis://redis:6379/0"
  JOB_TTL_HOURS: "${JOB_TTL_HOURS:-24}"
  ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
  MAX_CONCURRENT_INFERENCES: "${MAX_CONCURRENT_INFERENCES:-1}"
  CLASSIFICATION_CACHE_SIZE: "${CLASSIFICATION_CACHE_SIZE:-512}"
  MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-1000000}"
  # Addresses/CIDRs of reverse proxies whose X-Forwarded-For is trusted.
  # Empty = trust nobody (the header is ignored). See README, «Ограничение частоты».
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
  RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
  RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-10}"
  RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
  RATE_LIMIT_ADMIN_RPS: "${RATE_LIMIT_ADMIN_RPS:-1}"
  RATE_LIMIT_ADMIN_BURST: "${RATE_LIMIT_ADMIN_BURST:-2}"
  RATE_LIMIT_FILE_RPS: "${RATE_LIMIT_FILE_RPS:-1}"
  RATE_LIMIT_FILE_BURST: "${RATE_LIMIT_FILE_BURST:-3}"

x-app-build: &app-build
  context: .
  dockerfile: api/Dockerfile
  args:
    INSTALL_TRANSFORMER: "${INSTALL_TRANSFORMER:-true}"
    EMBEDDER_MODEL: "${EMBEDDER_MODEL:-intfloat/multilingual-e5-small}"

services:
  api:
    build: *app-build
    image: dora-app
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    environment: *app-env
    volumes:
      # Uploaded catalogs survive restarts and are shared with the worker; the first
      # mount seeds the volume from the image. Vector cache lives in data/dense_cache.
      - "catalog_data:/app/data"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: "${API_MEMORY_LIMIT:-2g}"
    cpus: "${API_CPUS:-2.0}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  worker:
    image: dora-app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      <<: *app-env
      # Belt and braces for the console-script entrypoint: unlike uvicorn, the
      # `celery` binary does not put the working directory on sys.path, so the
      # sibling `ml` package stayed invisible in the worker (ModuleNotFoundError
      # in every batch job). app/__init__.py adds the root itself; this keeps
      # the worker covered even if that bootstrap ever regresses.
      PYTHONPATH: /app
    volumes:
      - "catalog_data:/app/data"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: "${WORKER_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_CPUS:-2.0}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dora
      POSTGRES_USER: dora
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dora}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora -d dora"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-256m}"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: "${REDIS_MEMORY_LIMIT:-128m}"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: "${QDRANT_MEMORY_LIMIT:-768m}"
    cpus: "${QDRANT_CPUS:-1.0}"
    restart: unless-stopped

volumes:
  qdrant_data:
  catalog_data:
  postgres_data:
