# Dora B2B: one command — `docker compose up --build` — starts the whole stack:
#   api       FastAPI + React UI (/ui)           :8000
#   worker    Celery worker for heavy batches    (same image as api)
#   postgres  jobs, batch results, audit log
#   redis     Celery broker
#   qdrant    vector store for catalog embeddings
x-app-env: &app-env
  APP_NAME: "Dora B2BCase API"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  # JSON lines fit log aggregators; switch to LOG_FORMAT=text for local uvicorn.
  LOG_FORMAT: "${LOG_FORMAT:-json}"
  # Same name as the Docker build ARG: false makes a missing trained reranker
  # artifact a readiness failure instead of a silent heuristic downgrade.
  ALLOW_DEGRADE: "${ALLOW_DEGRADE:-false}"
  CLASSIFIER_BACKEND: "${CLASSIFIER_BACKEND:-catalog}"
  # Empty = keep the model artifact floors; values are read at API/worker startup.
  CATALOG_OK_FLOOR: "${CATALOG_OK_FLOOR:-}"
  CATALOG_REVIEW_FLOOR: "${CATALOG_REVIEW_FLOOR:-}"
  # Only for the pure-semantic `qdrant` backend (experiments); the default needs neither.
  ML_ENABLED: "${ML_ENABLED:-false}"
  # auto: reranker.<embedder-tag>.json when present, else the lexical one;
  # lexical: always reranker.json (rollback switch, no rebuild needed).
  SEMANTIC_RERANKER: "${SEMANTIC_RERANKER:-auto}"
  CATALOG_PATH: "${CATALOG_PATH:-}"
  DATA_DIR: "/app/data"
  # Vector search: embeddings of the catalog live in Qdrant; the embedder is the baked-in
  # transformer (falls back to spaCy vectors) — see /health/ready -> vector_search.
  VECTOR_SEARCH: "${VECTOR_SEARCH:-true}"
  VECTOR_STORE: "${VECTOR_STORE:-qdrant}"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
  QDRANT_COLLECTION: "${QDRANT_COLLECTION:-pp1875_items}"
  EMBEDDER_BACKEND: "${EMBEDDER_BACKEND:-auto}"
  MODEL_NAME: "${MODEL_NAME:-/opt/models/embedder}"
  MODEL_LOCAL_ONLY: "${MODEL_LOCAL_ONLY:-true}"
  MODEL_DEVICE: "${MODEL_DEVICE:-cpu}"
  MODEL_BATCH_SIZE: "${MODEL_BATCH_SIZE:-16}"
  # Cap the tokenizer window: long-context embedders (bge-m3: 8192) otherwise reserve
  # buffers for a length no product name ever needs. 0 = keep the model default.
  MODEL_MAX_SEQ_LENGTH: "${MODEL_MAX_SEQ_LENGTH:-512}"
  # Jobs and audit log in PostgreSQL; batches run in the Celery worker through Redis.
  JOB_STORE: "postgres"
  DATABASE_URL: "postgresql://dora:${POSTGRES_PASSWORD:-dora}@postgres:5432/dora"
  QUEUE_BACKEND: "celery"
  REDIS_URL: "redis://redis:6379/0"
  JOB_TTL_HOURS: "${JOB_TTL_HOURS:-24}"
  # Срок хранения двух журналов (BE-5). 0 = хранить вечно. Журнал запросов
  # содержит копии описаний закупок, поэтому чистится по умолчанию; вердикты —
  # это обучающие данные (ML-4), их не удаляем без явного решения.
  AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-90}"
  FEEDBACK_RETENTION_DAYS: "${FEEDBACK_RETENTION_DAYS:-0}"
  MAINTENANCE_INTERVAL_HOURS: "${MAINTENANCE_INTERVAL_HOURS:-24}"
  # Сколько снимков каталога хранить для POST /admin/catalog/rollback.
  CATALOG_SNAPSHOT_KEEP: "${CATALOG_SNAPSHOT_KEEP:-10}"
  ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
  MAX_CONCURRENT_INFERENCES: "${MAX_CONCURRENT_INFERENCES:-1}"
  CLASSIFICATION_CACHE_SIZE: "${CLASSIFICATION_CACHE_SIZE:-512}"
  MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-1000000}"
  # Третья ступень (по умолчанию выключена): LLM подтверждает одну из трёх
  # предложенных позиций для ответов review/not_found. Любой OpenAI-совместимый
  # endpoint; без ключа и модели ступень просто отсутствует.
  LLM_VERIFIER_ENABLED: "${LLM_VERIFIER_ENABLED:-false}"
  LLM_VERIFIER_BASE_URL: "${LLM_VERIFIER_BASE_URL:-https://api.openai.com/v1}"
  LLM_VERIFIER_API_KEY: "${LLM_VERIFIER_API_KEY:-}"
  LLM_VERIFIER_MODEL: "${LLM_VERIFIER_MODEL:-}"
  LLM_VERIFIER_TIMEOUT: "${LLM_VERIFIER_TIMEOUT:-8}"
  LLM_VERIFIER_CALLS_PER_MINUTE: "${LLM_VERIFIER_CALLS_PER_MINUTE:-60}"
  # Addresses/CIDRs of reverse proxies whose X-Forwarded-For is trusted.
  # Empty = trust nobody (the header is ignored). See README, «Ограничение частоты».
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
  RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
  RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-10}"
  RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
  RATE_LIMIT_ADMIN_RPS: "${RATE_LIMIT_ADMIN_RPS:-1}"
  RATE_LIMIT_ADMIN_BURST: "${RATE_LIMIT_ADMIN_BURST:-2}"
  RATE_LIMIT_FILE_RPS: "${RATE_LIMIT_FILE_RPS:-1}"
  RATE_LIMIT_FILE_BURST: "${RATE_LIMIT_FILE_BURST:-3}"

x-app-build: &app-build
  context: .
  dockerfile: api/Dockerfile
  args:
    INSTALL_TRANSFORMER: "${INSTALL_TRANSFORMER:-true}"
    ALLOW_DEGRADE: "${ALLOW_DEGRADE:-false}"
    EMBEDDER_MODEL: "${EMBEDDER_MODEL:-intfloat/multilingual-e5-small}"

services:
  api:
    build: *app-build
    image: dora-app
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    environment: *app-env
    volumes:
      # Uploaded catalogs survive restarts and are shared with the worker; the first
      # mount seeds the volume from the image. Vector cache lives in data/dense_cache.
      - "catalog_data:/app/data"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: "${API_MEMORY_LIMIT:-2g}"
    cpus: "${API_CPUS:-2.0}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  worker:
    # Same definition as `api`: without `build` here compose treats the tag as a
    # pullable image and `up --build` starts with
    # «✘ Image dora-app Error pull access denied» before the api build provides it.
    build: *app-build
    image: dora-app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      <<: *app-env
      # Belt and braces for the console-script entrypoint: unlike uvicorn, the
      # `celery` binary does not put the working directory on sys.path, so the
      # sibling `ml` package stayed invisible in the worker (ModuleNotFoundError
      # in every batch job). app/__init__.py adds the root itself; this keeps
      # the worker covered even if that bootstrap ever regresses.
      PYTHONPATH: /app
    volumes:
      - "catalog_data:/app/data"
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: "${WORKER_MEMORY_LIMIT:-2g}"
    cpus: "${WORKER_CPUS:-2.0}"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dora
      POSTGRES_USER: dora
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-dora}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora -d dora"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: "${POSTGRES_MEMORY_LIMIT:-256m}"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: "${REDIS_MEMORY_LIMIT:-128m}"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: "${QDRANT_MEMORY_LIMIT:-768m}"
    cpus: "${QDRANT_CPUS:-1.0}"
    restart: unless-stopped

  # Optional observability stack, never started by a plain `docker compose up`:
  #   docker compose --profile monitoring up --build
  # Prometheus scrapes api:8000/metrics; Grafana auto-provisions the datasource
  # and the dashboard from deploy/monitoring (read-only mounts).
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_started
    mem_limit: "${PROMETHEUS_MEMORY_LIMIT:-512m}"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-dora}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    mem_limit: "${GRAFANA_MEMORY_LIMIT:-256m}"
    restart: unless-stopped

volumes:
  qdrant_data:
  catalog_data:
  postgres_data:
  prometheus_data:
  grafana_data:
